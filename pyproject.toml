[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-core"
version = "1.0.0"
description = "Shared infrastructure and utility module for showcase projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "pgvector>=0.2.0",
    "redis>=5.0.0",
    "loguru>=0.7.0",
    "httpx>=0.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "pyright>=1.1.0",
    "respx>=0.20.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0"
]
