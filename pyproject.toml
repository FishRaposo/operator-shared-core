[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-core"
version = "1.3.0"
description = "Shared infrastructure and utility module for showcase projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "pgvector>=0.2.0",
    "redis>=5.0.0",
    "loguru>=0.7.0",
    "httpx>=0.24.0"
]

[project.optional-dependencies]
# Heavy/optional capability deps for the expansion modules. These are NOT required
# by core consumers; each module dynamically imports them and raises a friendly
# ImportError when missing. Install per-need, e.g. pip install -e '../shared-core[docparse]'.
docparse = [
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "markdown-it-py>=3.0.0"
]
embeddings = [
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "aiosqlite>=0.19.0",
    "fastapi>=0.100.0",
    "ruff>=0.1.0",
    "pyright>=1.1.0",
    "respx>=0.20.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0"
]
