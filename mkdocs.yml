site_name: shared-core
site_description: Shared infrastructure library for Operator Systems showcase portfolio
theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            heading_level: 2

nav:
  - Home: README.md
  - Architecture: docs/architecture.md
  - Design Decisions: docs/design-decisions.md
  - Failure Modes: docs/failure-modes.md
  - Security: docs/security.md
  - Roadmap: docs/roadmap.md
  - Implementation Plan: docs/implementation_plan.md
  - API Reference:
      - config: docs/api/config.md
      - database: docs/api/database.md
      - errors: docs/api/errors.md
      - logging: docs/api/logging.md
      - redis: docs/api/redis.md
      - health: docs/api/health.md
      - clients: docs/api/clients.md
      - llm: docs/api/llm.md
      - tasks: docs/api/tasks.md
      - metrics: docs/api/metrics.md
      - testing: docs/api/testing.md
